
services:
  mongo:
    image: mongo:7
    container_name: currency_mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: currency123

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1
    container_name: currency_mongo_express
    restart: unless-stopped

    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:currency123@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: express123

    ports:
      - "8081:8081"

    depends_on:
      - mongo

volumes:
  mongodb_data:
    name: currency_mongodb_data
